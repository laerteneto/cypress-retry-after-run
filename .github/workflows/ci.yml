name: CI

on:
  push:
  pull_request:

jobs:
  test-plugin:
    name: Test Plugin (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: cypress-js
            log: retry.log
          - example: cypress-ts
            log: retry-ts.log
    env:
      FORCE_COLOR: 1
      TERM: xterm-256color

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Plugin Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Example Dependencies
        working-directory: ./examples/${{ matrix.example }}
        run: pnpm install --frozen-lockfile

      # ── Run 1: Standard run — expect failures so the plugin writes .cypress-failures.json ──

      - name: Run 1 - Standard Cypress Run
        working-directory: ./examples/${{ matrix.example }}
        run: pnpm test || true   # intentional failures → exit 2, continue

      - name: Verify .cypress-failures.json was created
        working-directory: ./examples/${{ matrix.example }}
        run: |
          if [ ! -f ".cypress-failures.json" ]; then
            echo "::error::.cypress-failures.json was not created by the plugin!"
            exit 1
          fi
          FAIL_COUNT=$(grep -o '"title":' .cypress-failures.json | wc -l | tr -d ' ')
          echo "Failures recorded: $FAIL_COUNT"
          if [ "$FAIL_COUNT" != "2" ]; then
            echo "::error::Expected 2 failures recorded, found $FAIL_COUNT"
            exit 1
          fi
          echo "Failures file looks correct."

      # ── Run 2: Retry — must only run the 2 failed tests (4 others pending) ──

      - name: Run 2 - Retry Only Failed Tests
        working-directory: ./examples/${{ matrix.example }}
        run: |
          set +e
          pnpm exec cypress-retry 2>&1 | tee ${{ matrix.log }}
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # Strip ANSI colour codes so grep works reliably
          sed -i 's/\x1b\[[0-9;]*m//g' ${{ matrix.log }}

          # The retry should fail again (tests are intentionally broken)
          if [ $EXIT_CODE -eq 0 ]; then
            echo "::error::Retry passed unexpectedly — tests should still fail!"
            exit 1
          fi

          # Verify grep filter worked: only 2 tests should have run (Failing: 2),
          # and the remaining 4 should be pending (skipped by @cypress/grep).
          if grep -q "Failing:.*2" ${{ matrix.log }} && grep -q "Pending:.*4" ${{ matrix.log }}; then
            echo "Retry correctly ran only the 2 failed tests (4 others pending)."
          else
            echo "::error::Retry did not filter tests correctly. Expected Failing: 2, Pending: 4."
            cat ${{ matrix.log }}
            exit 1
          fi

      - name: Upload retry log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-log-${{ matrix.example }}
          path: ./examples/${{ matrix.example }}/${{ matrix.log }}

