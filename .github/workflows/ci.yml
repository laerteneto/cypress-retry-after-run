name: CI

on:
  push:
  pull_request:

jobs:
  test-plugin:
    name: Test Plugin (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: cypress-js
            log: retry.log
          - example: cypress-ts
            log: retry-ts.log
    env:
      FORCE_COLOR: 1
      TERM: xterm-256color

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Plugin Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Example Dependencies
        working-directory: ./examples/${{ matrix.example }}
        run: pnpm install --frozen-lockfile

      - name: Install Cypress binary
        working-directory: ./examples/${{ matrix.example }}
        run: pnpm exec cypress install

      # ── Run 1: Standard run — expect failures so the plugin writes .cypress-failures.json ──

      - name: Run 1 - Standard Cypress Run
        working-directory: ./examples/${{ matrix.example }}
        run: pnpm test || true   # intentional failures → exit 2, continue

      - name: Verify .cypress-failures.json was created
        working-directory: ./examples/${{ matrix.example }}
        run: |
          if [ ! -f ".cypress-failures.json" ]; then
            echo "::error::.cypress-failures.json was not created by the plugin!"
            exit 1
          fi
          FAIL_COUNT=$(grep -o '"title":' .cypress-failures.json | wc -l | tr -d ' ')
          echo "Failures recorded: $FAIL_COUNT"
          if [ "$FAIL_COUNT" != "2" ]; then
            echo "::error::Expected 2 failures recorded, found $FAIL_COUNT"
            exit 1
          fi
          echo "Failures file looks correct."

      # ── Run 2: Retry — must only run the 2 failed tests (4 others pending) ──

      - name: Run 2 - Retry Only Failed Tests
        working-directory: ./examples/${{ matrix.example }}
        run: |
          set +e
          pnpm exec cypress-retry 2>&1 | tee ${{ matrix.log }}
          RETRY_EXIT=$?
          set -e

          # Strip ANSI colour codes so grep works reliably
          sed -i 's/\x1b\[[0-9;]*m//g' ${{ matrix.log }}

          # Primary check: @cypress/grep prints its own header when the filter is applied.
          # e.g. '@cypress/grep: tests with "Spec 1 fails 1;Spec 2 fails 2" in their names'
          if ! grep -q "cypress/grep: tests with" ${{ matrix.log }}; then
            echo "::error::@cypress/grep filter was not applied. The retry ran without filtering!"
            cat ${{ matrix.log }}
            exit 1
          fi

          # Secondary check: some tests must have been skipped (Pending > 0).
          # Cypress shows 'Pending: N' per-spec inside the result box.
          # With 2 specs of 3 tests each, 2 non-failed tests per spec → 'Pending:      2' appears twice.
          PENDING_COUNT=$(grep -c "Pending:.*[1-9]" ${{ matrix.log }} || true)
          if [ "$PENDING_COUNT" -lt 1 ]; then
            echo "::error::No tests were skipped as pending — @cypress/grep may not be filtering!"
            cat ${{ matrix.log }}
            exit 1
          fi

          echo "Retry correctly filtered tests: @cypress/grep was applied and $PENDING_COUNT spec(s) had pending (skipped) tests."
          echo "Retry exit code: $RETRY_EXIT (tests may still be genuinely failing — that is expected for this demo)."


      - name: Upload retry log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-log-${{ matrix.example }}
          path: ./examples/${{ matrix.example }}/${{ matrix.log }}

